# Generado desde el código de la réplica con @nestjs/swagger (DP-52). No se edita a mano.
# Se regenera con: docker compose --profile herramientas run --rm --build --no-deps openapi
components:
  schemas:
    CrearPedidoDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ItemDePedidoDto'
          type: array
        tableSessionId:
          type: integer
      required:
        - tableSessionId
        - items
      type: object
    CuerpoDePedidoConfirmado:
      properties:
        confirmedAt:
          description: ISO 8601 en UTC; sin fracción, como la columna.
          format: date-time
          type: string
        orderId:
          type: integer
        restaurantId:
          format: uuid
          type: string
        tableNumber:
          type: integer
        tableSessionId:
          type: integer
      required:
        - orderId
        - tableNumber
        - tableSessionId
        - restaurantId
        - confirmedAt
      type: object
    ErrorHttp:
      properties:
        error:
          example: Unauthorized
          type: string
        message:
          description: El motivo del rechazo.
          type: string
        statusCode:
          example: 401
          type: integer
      required:
        - statusCode
        - message
        - error
      type: object
    EventoPedidoConfirmado:
      properties:
        body:
          description: JSON en string con la forma de CuerpoDePedidoConfirmado.
          type: string
      required:
        - body
      type: object
    EventoSolicitudDeCobro:
      additionalProperties: true
      properties:
        amount:
          type: number
        id:
          description: uuid v4 que genera la réplica; las de MercadoPago, mp-<userId>-<sessionId>-<timestamp>.
          type: string
        lineItemIds:
          items:
            type: number
          type: array
        method:
          description: Por ejemplo POS, Cash o Mercadopago.
          type: string
        noTipAmount:
          type: number
        orderIds:
          items:
            type: number
          type: array
        prepaid:
          type: boolean
        restaurantId:
          type: string
        tableNumber:
          type: number
        tableSessionId:
          type: number
        userId:
          description: user.id, o un texto como "guest".
          oneOf:
            - type: number
            - type: string
        userName:
          description: 'Nombre del comensal: dato personal (DP-84).'
          type: string
          x-sensitive: true
      required:
        - id
        - userId
        - userName
        - restaurantId
        - tableNumber
        - tableSessionId
        - amount
        - noTipAmount
        - method
      type: object
    GuestDto:
      properties:
        guestId:
          description: Identificador del invitado, de 1 a 64 caracteres.
          pattern: ^[A-Za-z0-9-]{1,64}$
          type: string
      required:
        - guestId
      type: object
    ItemDePedidoDto:
      properties:
        note:
          type: string
        productId:
          type: integer
        quantity:
          minimum: 1
          type: integer
        selectedOptions:
          items:
            $ref: '#/components/schemas/OpcionElegidaDto'
          type: array
      required:
        - productId
        - quantity
      type: object
    JoinDto:
      properties:
        userId:
          description: El user.id que devolvió /auth/guest.
          type: integer
      required:
        - userId
      type: object
    LoginDto:
      properties:
        firebaseIdToken:
          description: ID token de Firebase del usuario autenticado.
          type: string
          x-sensitive: true
      required:
        - firebaseIdToken
      type: object
    OpcionElegidaDto:
      properties:
        productOptionId:
          type: integer
        valueIds:
          description: Los ids de los product_option_value elegidos de esa opción.
          items:
            type: number
          type: array
      required:
        - productOptionId
        - valueIds
      type: object
    Order:
      properties:
        canceledAt:
          format: date-time
          nullable: true
          type: string
        cancellationReason:
          nullable: true
          type: string
        confirmedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: integer
        isPaid:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/OrderProductDetails'
          type: array
        paidAt:
          format: date-time
          nullable: true
          type: string
        sentToKitchenAt:
          format: date-time
          nullable: true
          type: string
        status:
          enum:
            - pending
            - confirmed
            - in_kitchen
            - canceled
          type: string
        type:
          enum:
            - appetizer
            - main_course
            - dessert
          type: string
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
      required:
        - id
        - user
        - items
        - type
        - status
        - createdAt
        - confirmedAt
        - sentToKitchenAt
        - canceledAt
        - cancellationReason
        - isPaid
        - paidAt
      type: object
    OrderProductDetails:
      properties:
        id:
          type: integer
        note:
          nullable: true
          type: string
        product:
          allOf:
            - $ref: '#/components/schemas/Product'
          nullable: true
        quantity:
          type: integer
        quantityPaid:
          type: integer
        selectedOptions:
          items:
            $ref: '#/components/schemas/OrderProductOption'
          type: array
      required:
        - id
        - product
        - quantity
        - quantityPaid
        - note
        - selectedOptions
      type: object
    OrderProductOption:
      properties:
        id:
          type: integer
        productOption:
          allOf:
            - $ref: '#/components/schemas/ProductOption'
          nullable: true
        values:
          items:
            $ref: '#/components/schemas/ProductOptionValue'
          type: array
      required:
        - id
        - productOption
        - values
      type: object
    PagoDeSesion:
      properties:
        amount:
          description: 'decimal(10,2): llega como string.'
          type: string
        createdAt:
          format: date-time
          type: string
        currency:
          type: string
        id:
          type: integer
        method:
          nullable: true
          type: string
        prepaid:
          type: boolean
        sessionId:
          type: integer
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
        userId:
          nullable: true
          type: integer
      required:
        - id
        - sessionId
        - amount
        - currency
        - method
        - createdAt
        - prepaid
        - userId
        - user
      type: object
    PedidoDeRespuesta:
      properties:
        canceledAt:
          format: date-time
          nullable: true
          type: string
        cancellationReason:
          nullable: true
          type: string
        confirmedAt:
          description: ISO 8601 en UTC con milisegundos; el datetime no guarda fracción, así que termina en .000Z.
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: integer
        isPaid:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/OrderProductDetails'
          type: array
        paidAt:
          format: date-time
          nullable: true
          type: string
        restaurantId:
          format: uuid
          nullable: true
          type: string
        sentToKitchenAt:
          format: date-time
          nullable: true
          type: string
        status:
          enum:
            - pending
            - confirmed
            - in_kitchen
            - canceled
          type: string
        tableSessionId:
          nullable: true
          type: integer
        type:
          enum:
            - appetizer
            - main_course
            - dessert
          type: string
        userId:
          nullable: true
          type: integer
      required:
        - id
        - userId
        - restaurantId
        - tableSessionId
        - items
        - type
        - status
        - createdAt
        - confirmedAt
        - sentToKitchenAt
        - canceledAt
        - cancellationReason
        - isPaid
        - paidAt
      type: object
    Product:
      properties:
        acceptsNotes:
          type: boolean
        category:
          nullable: true
          type: string
        deletedSince:
          format: date-time
          nullable: true
          type: string
        description:
          nullable: true
          type: string
        glutenFree:
          type: boolean
        hide:
          type: boolean
        id:
          type: integer
        imageUrl:
          nullable: true
          type: string
        isVegan:
          type: boolean
        name:
          type: string
        price:
          description: 'decimal(10,0): llega como string.'
          type: string
      required:
        - id
        - name
        - description
        - deletedSince
        - imageUrl
        - hide
        - price
        - acceptsNotes
        - isVegan
        - glutenFree
        - category
      type: object
    ProductOption:
      properties:
        description:
          nullable: true
          type: string
        id:
          type: integer
        limit:
          type: integer
        name:
          type: string
        type:
          enum:
            - single-choice
            - multiple-choice
          type: string
      required:
        - id
        - name
        - description
        - type
        - limit
      type: object
    ProductOptionValue:
      properties:
        description:
          type: string
        id:
          type: integer
        limit:
          type: integer
        price:
          description: 'decimal(10,0): llega como string.'
          type: string
      required:
        - id
        - description
        - limit
        - price
      type: object
    RespuestaDeLogin:
      properties:
        access_token:
          description: JWT propio, HS256, con los claims userId, role, iat y exp.
          type: string
          x-sensitive: true
        user:
          $ref: '#/components/schemas/UsuarioDeLogin'
      required:
        - access_token
        - user
      type: object
    Restaurant:
      properties:
        address:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        imageUrl:
          nullable: true
          type: string
        isActive:
          type: boolean
        logoUrl:
          nullable: true
          type: string
        mercadoPagoRefreshToken:
          nullable: true
          type: string
          x-sensitive: true
        mercadoPagoToken:
          nullable: true
          type: string
          x-sensitive: true
        mercadoPagoUserId:
          description: 'bigint: llega como string.'
          nullable: true
          type: string
        name:
          type: string
        paymentStyle:
          enum:
            - before-order
            - after-order
          type: string
        phone:
          nullable: true
          type: string
        redPulseTicketSeconds:
          type: integer
        redTicketSeconds:
          type: integer
        specialtySubtitle:
          nullable: true
          type: string
        yellowTicketSeconds:
          type: integer
      required:
        - id
        - name
        - address
        - phone
        - mercadoPagoToken
        - mercadoPagoRefreshToken
        - mercadoPagoUserId
        - isActive
        - specialtySubtitle
        - imageUrl
        - logoUrl
        - paymentStyle
        - yellowTicketSeconds
        - redTicketSeconds
        - redPulseTicketSeconds
      type: object
    SesionDeJoin:
      properties:
        amountPaid:
          description: 'decimal(10,2): llega como string.'
          type: string
        closedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: integer
        requestingHelp:
          type: boolean
        tableId:
          type: integer
        tips:
          description: 'decimal(10,2): llega como string.'
          type: string
        total:
          description: 'decimal(10,2): llega como string.'
          type: string
        users:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
        - id
        - tableId
        - amountPaid
        - tips
        - total
        - requestingHelp
        - createdAt
        - closedAt
        - users
      type: object
    SolicitudDeCobroEntrada:
      additionalProperties: true
      properties:
        amount:
          type: number
        body:
          description: 'Envoltorio: el JSON de la solicitud escrito en un string. Si no es el JSON de un objeto, se guarda tal cual.'
          type: string
        lineItemIds:
          items:
            type: number
          type: array
        method:
          description: Por ejemplo POS, Cash o Mercadopago.
          type: string
        noTipAmount:
          type: number
        orderIds:
          items:
            type: number
          type: array
        prepaid:
          type: boolean
        restaurantId:
          description: 'El restaurante de la solicitud: sin él no hay clave en Redis.'
          type: string
        tableNumber:
          type: number
        tableSessionId:
          type: number
        userId:
          description: user.id, o un texto como "guest".
          oneOf:
            - type: number
            - type: string
        userName:
          description: 'Nombre del comensal: dato personal (DP-84).'
          type: string
          x-sensitive: true
      required:
        - restaurantId
      type: object
    Table:
      properties:
        activeSession:
          allOf:
            - $ref: '#/components/schemas/TableSession'
          nullable: true
        activeSessionId:
          nullable: true
          type: integer
        id:
          type: integer
        isBusy:
          type: boolean
        number:
          type: integer
        qrCode:
          type: string
        restaurant:
          allOf:
            - $ref: '#/components/schemas/Restaurant'
          nullable: true
        seats:
          type: integer
      required:
        - id
        - number
        - seats
        - qrCode
        - restaurant
        - activeSessionId
        - activeSession
        - isBusy
      type: object
    TableSession:
      properties:
        amountPaid:
          description: 'decimal(10,2): llega como string.'
          type: string
        closedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: integer
        orders:
          description: Sin los pedidos pending; con los canceled; por createdAt ascendente.
          items:
            $ref: '#/components/schemas/Order'
          type: array
        requestingHelp:
          type: boolean
        tableId:
          type: integer
        tips:
          description: 'decimal(10,2): llega como string.'
          type: string
        total:
          description: 'decimal(10,2): llega como string.'
          type: string
        users:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
        - id
        - tableId
        - amountPaid
        - tips
        - total
        - requestingHelp
        - users
        - orders
        - createdAt
        - closedAt
      type: object
    User:
      properties:
        email:
          type: string
          x-sensitive: true
        id:
          type: integer
        isGuest:
          type: boolean
        name:
          nullable: true
          type: string
          x-sensitive: true
        restaurant:
          allOf:
            - $ref: '#/components/schemas/Restaurant'
          nullable: true
        role:
          enum:
            - user
            - admin
            - waiter
            - backoffice
          type: string
      required:
        - id
        - email
        - role
        - isGuest
        - name
        - restaurant
      type: object
    UsuarioDeLogin:
      properties:
        email:
          type: string
          x-sensitive: true
        id:
          type: integer
        name:
          nullable: true
          type: string
          x-sensitive: true
        restaurantId:
          description: El uuid del restaurante, o "-1" si el usuario no tiene.
          type: string
        role:
          enum:
            - user
            - admin
            - waiter
            - backoffice
          type: string
      required:
        - id
        - email
        - name
        - role
        - restaurantId
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: 'Contrato de la réplica propia (0010, DP-48), tomado de docs/context/panel-mozos-actual.md. Los campos marcados x-sensitive: true son credenciales o datos personales que no se registran ni se muestran.'
  title: Réplica del backend de Tabbie
  version: 1.0.0
openapi: 3.0.0
paths:
  /auth/guest:
    post:
      description: Público, sin Firebase. Inserta o reusa la fila user del guestId (isGuest, rol user, sin restaurante, email invitado.<guestId>@example.com). El JWT vence a los JWT_EXPIRATION. Sin guestId o con otro formato, 400.
      operationId: AuthController_guest
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDeLogin'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: guestId ausente o con formato inválido.
      summary: JWT de invitado para un comensal (T02)
      tags:
        - auth
  /auth/login:
    post:
      description: Público. Con USE_FIREBASE desactivada responde 503 y no emite ningún JWT. Un body sin firebaseIdToken, un token inválido o vencido, o un token sin email responden 401.
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDeLogin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: ID token ausente, inválido, vencido o sin email.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Firebase desactivado (USE_FIREBASE).
      summary: Canjea un ID token de Firebase por un JWT propio (T01)
      tags:
        - auth
  /orders:
    post:
      description: J, sin roles. El userId sale del JWT y el restaurantId, de la mesa de la sesión. Un pedido pending no aparece en T05 ni cuenta en table_session.total.
      operationId: OrdersController_crear
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedidoDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDeRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Cuerpo inválido, producto, opción o valor que no corresponden.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El usuario no está en la sesión.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: La sesión no existe.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: La sesión está cerrada.
      security:
        - bearer: []
      summary: El comensal crea un pedido pending (DP-75)
      tags:
        - orders
  /orders/{id}/confirm:
    put:
      description: 'Sin body. Fija status confirmed y confirmedAt (UTC, sin fracción), recalcula table_session.total (DP-77) y emite order-confirmed-notification al restaurante del pedido (DP-78). El mozo no confirma: 403.'
      operationId: OrdersController_confirmar
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDeRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El id no es un entero.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Rol fuera de admin y user, o un user que no está en la sesión del pedido.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El pedido no existe.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El pedido no está pending.
      security:
        - bearer: []
      summary: Confirma un pedido pending (DP-76)
      tags:
        - orders
  /payments/in-person-request:
    post:
      description: 'J. Guarda el body sin validar en Redis (si trae {body: "<JSON>"}, el de adentro) con un id uuid v4 que genera la réplica, con vencimiento REDIS_EXPIRATION_TIME, y emite in-person-payment-request al restaurante del body. El único rechazo de negocio es 400 si falta restaurantId.'
      operationId: PaymentsController_crear
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudDeCobroEntrada'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoSolicitudDeCobro'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Falta restaurantId.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT válido.
      security:
        - bearer: []
      summary: El comensal pide pagar en persona (DP-79)
      tags:
        - payments
  /payments/in-person-requests:
    get:
      description: Las solicitudes guardadas en Redis (SCAN), incluidas las de MercadoPago, sin orden garantizado. Sin solicitudes, []. Un valor que no es JSON se omite. Un usuario sin restaurante recibe 403 (DP-64).
      operationId: PaymentsController_solicitudes
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EventoSolicitudDeCobro'
                type: array
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT válido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El usuario no tiene restaurante.
      security:
        - bearer: []
      summary: Solicitudes de cobro del restaurante del usuario (T06)
      tags:
        - payments
  /restaurants/{id}/tables/active:
    get:
      description: 'Mesas con isBusy y una sesión activa (closedAt nulo), por number ascendente. Cada sesión trae sus usuarios y sus pedidos (sin los pending, con los canceled, por createdAt ascendente). Reproduce O4 a propósito (DP-50): no excluye campos, así que llegan mercadoPagoToken, mercadoPagoRefreshToken y los email. El JWT va en Authorization: Bearer o en ?token=.'
      operationId: RestaurantsController_mesasActivas
      parameters:
        - description: Uuid del restaurante.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Table'
                type: array
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT, vencido, con otra firma o con un userId inexistente.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Rol fuera de @Roles o restaurante distinto del del usuario.
      security:
        - bearer: []
      summary: Mesas ocupadas del restaurante con sus pedidos (T05)
      tags:
        - restaurants
  /sse/waiters:
    get:
      description: 'Server-Sent Events del restaurante del usuario. El JWT va en Authorization: Bearer o en ?token=; con un JWT vencido responde 401 antes de abrir el stream. Sin heartbeat ni replay. Eventos: `order-confirmed-notification` (data: {"body": "<JSON en string>"} con orderId, tableNumber, tableSessionId, restaurantId y confirmedAt, esquemas EventoPedidoConfirmado y CuerpoDePedidoConfirmado; lo emite PUT /orders/:id/confirm), `in-person-payment-request` (data: la solicitud de cobro, esquema EventoSolicitudDeCobro; lo emite POST /payments/in-person-request) e `in-person-payment-request-deleted` (data: {requestId, restaurantId}; lo emite DELETE /payments/in-person-requests/:requestId, TK-13, todavía no construido).'
      operationId: SseController_mozos
      parameters: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: Stream abierto.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT, vencido, con otra firma o con un userId inexistente.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El usuario no tiene restaurante (DP-64).
      security:
        - bearer: []
      summary: Stream de eventos para los mozos del restaurante (T16, T17)
      tags:
        - sse
  /table-sessions/join/restaurant/{restaurantId}/table/{tableNumber}:
    post:
      description: 'Sin guard. Con la mesa libre abre la table_session y la deja ocupada; con la mesa ocupada suma al comensal a la sesión activa sin duplicarlo. Solo se unen comensales: un userId con otro rol o con restaurante da 403. Bloquea la fila de la mesa en una transacción. Responde con la sesión y sus users.'
      operationId: TableSessionsController_unirse
      parameters:
        - description: Uuid del restaurante.
          in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - description: Número de la mesa en el restaurante.
          in: path
          name: tableNumber
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionDeJoin'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Body sin userId entero.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El usuario no es un comensal (rol user y sin restaurante), DP-83.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Restaurante, mesa o usuario inexistente.
      summary: El comensal se une a la mesa (DP-74)
      tags:
        - table-sessions
  /table-sessions/{id}/payments:
    get:
      description: 'Los payment de la sesión por createdAt e id ascendente, cada uno con su user y el restaurant del user (null en los pagos manuales). Sin pagos o con una sesión que no existe, []. Reproduce O2 a propósito (DP-50): sin RolesGuard ni chequeo de restaurante.'
      operationId: TableSessionsController_pagos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PagoDeSesion'
                type: array
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El id no es un entero.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT válido.
      security:
        - bearer: []
      summary: Pagos de la sesión (T07)
      tags:
        - table-sessions
