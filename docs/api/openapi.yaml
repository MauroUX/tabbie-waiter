# Generado desde el código de la réplica con @nestjs/swagger (DP-52). No se edita a mano.
# Se regenera con: docker compose --profile herramientas run --rm --build --no-deps openapi
components:
  schemas:
    ErrorHttp:
      properties:
        error:
          example: Unauthorized
          type: string
        message:
          description: El motivo del rechazo.
          type: string
        statusCode:
          example: 401
          type: integer
      required:
        - statusCode
        - message
        - error
      type: object
    LoginDto:
      properties:
        firebaseIdToken:
          description: ID token de Firebase del usuario autenticado.
          type: string
          x-sensitive: true
      required:
        - firebaseIdToken
      type: object
    Order:
      properties:
        canceledAt:
          format: date-time
          nullable: true
          type: string
        cancellationReason:
          nullable: true
          type: string
        confirmedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: integer
        isPaid:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/OrderProductDetails'
          type: array
        paidAt:
          format: date-time
          nullable: true
          type: string
        sentToKitchenAt:
          format: date-time
          nullable: true
          type: string
        status:
          enum:
            - pending
            - confirmed
            - in_kitchen
            - canceled
          type: string
        type:
          enum:
            - appetizer
            - main_course
            - dessert
          type: string
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
      required:
        - id
        - user
        - items
        - type
        - status
        - createdAt
        - confirmedAt
        - sentToKitchenAt
        - canceledAt
        - cancellationReason
        - isPaid
        - paidAt
      type: object
    OrderProductDetails:
      properties:
        id:
          type: integer
        note:
          nullable: true
          type: string
        product:
          allOf:
            - $ref: '#/components/schemas/Product'
          nullable: true
        quantity:
          type: integer
        quantityPaid:
          type: integer
        selectedOptions:
          items:
            $ref: '#/components/schemas/OrderProductOption'
          type: array
      required:
        - id
        - product
        - quantity
        - quantityPaid
        - note
        - selectedOptions
      type: object
    OrderProductOption:
      properties:
        id:
          type: integer
        productOption:
          allOf:
            - $ref: '#/components/schemas/ProductOption'
          nullable: true
        values:
          items:
            $ref: '#/components/schemas/ProductOptionValue'
          type: array
      required:
        - id
        - productOption
        - values
      type: object
    Product:
      properties:
        acceptsNotes:
          type: boolean
        category:
          nullable: true
          type: string
        deletedSince:
          format: date-time
          nullable: true
          type: string
        description:
          nullable: true
          type: string
        glutenFree:
          type: boolean
        hide:
          type: boolean
        id:
          type: integer
        imageUrl:
          nullable: true
          type: string
        isVegan:
          type: boolean
        name:
          type: string
        price:
          description: 'decimal(10,0): llega como string.'
          type: string
      required:
        - id
        - name
        - description
        - deletedSince
        - imageUrl
        - hide
        - price
        - acceptsNotes
        - isVegan
        - glutenFree
        - category
      type: object
    ProductOption:
      properties:
        description:
          nullable: true
          type: string
        id:
          type: integer
        limit:
          type: integer
        name:
          type: string
        type:
          enum:
            - single-choice
            - multiple-choice
          type: string
      required:
        - id
        - name
        - description
        - type
        - limit
      type: object
    ProductOptionValue:
      properties:
        description:
          type: string
        id:
          type: integer
        limit:
          type: integer
        price:
          description: 'decimal(10,0): llega como string.'
          type: string
      required:
        - id
        - description
        - limit
        - price
      type: object
    RespuestaDeLogin:
      properties:
        access_token:
          description: JWT propio, HS256, con los claims userId, role, iat y exp.
          type: string
          x-sensitive: true
        user:
          $ref: '#/components/schemas/UsuarioDeLogin'
      required:
        - access_token
        - user
      type: object
    Restaurant:
      properties:
        address:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        imageUrl:
          nullable: true
          type: string
        isActive:
          type: boolean
        logoUrl:
          nullable: true
          type: string
        mercadoPagoRefreshToken:
          nullable: true
          type: string
          x-sensitive: true
        mercadoPagoToken:
          nullable: true
          type: string
          x-sensitive: true
        mercadoPagoUserId:
          description: 'bigint: llega como string.'
          nullable: true
          type: string
        name:
          type: string
        paymentStyle:
          enum:
            - before-order
            - after-order
          type: string
        phone:
          nullable: true
          type: string
        redPulseTicketSeconds:
          type: integer
        redTicketSeconds:
          type: integer
        specialtySubtitle:
          nullable: true
          type: string
        yellowTicketSeconds:
          type: integer
      required:
        - id
        - name
        - address
        - phone
        - mercadoPagoToken
        - mercadoPagoRefreshToken
        - mercadoPagoUserId
        - isActive
        - specialtySubtitle
        - imageUrl
        - logoUrl
        - paymentStyle
        - yellowTicketSeconds
        - redTicketSeconds
        - redPulseTicketSeconds
      type: object
    Table:
      properties:
        activeSession:
          allOf:
            - $ref: '#/components/schemas/TableSession'
          nullable: true
        activeSessionId:
          nullable: true
          type: integer
        id:
          type: integer
        isBusy:
          type: boolean
        number:
          type: integer
        qrCode:
          type: string
        restaurant:
          allOf:
            - $ref: '#/components/schemas/Restaurant'
          nullable: true
        seats:
          type: integer
      required:
        - id
        - number
        - seats
        - qrCode
        - restaurant
        - activeSessionId
        - activeSession
        - isBusy
      type: object
    TableSession:
      properties:
        amountPaid:
          description: 'decimal(10,2): llega como string.'
          type: string
        closedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: integer
        orders:
          description: Sin los pedidos pending; con los canceled; por createdAt ascendente.
          items:
            $ref: '#/components/schemas/Order'
          type: array
        requestingHelp:
          type: boolean
        tableId:
          type: integer
        tips:
          description: 'decimal(10,2): llega como string.'
          type: string
        total:
          description: 'decimal(10,2): llega como string.'
          type: string
        users:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
        - id
        - tableId
        - amountPaid
        - tips
        - total
        - requestingHelp
        - users
        - orders
        - createdAt
        - closedAt
      type: object
    User:
      properties:
        email:
          type: string
          x-sensitive: true
        id:
          type: integer
        isGuest:
          type: boolean
        name:
          nullable: true
          type: string
        restaurant:
          allOf:
            - $ref: '#/components/schemas/Restaurant'
          nullable: true
        role:
          enum:
            - user
            - admin
            - waiter
            - backoffice
          type: string
      required:
        - id
        - email
        - role
        - isGuest
        - name
        - restaurant
      type: object
    UsuarioDeLogin:
      properties:
        email:
          type: string
          x-sensitive: true
        id:
          type: integer
        name:
          nullable: true
          type: string
        restaurantId:
          description: El uuid del restaurante, o "-1" si el usuario no tiene.
          type: string
        role:
          enum:
            - user
            - admin
            - waiter
            - backoffice
          type: string
      required:
        - id
        - email
        - name
        - role
        - restaurantId
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: 'Contrato de la réplica propia (0010, DP-48), tomado de docs/context/panel-mozos-actual.md. Los campos marcados x-sensitive: true son credenciales o datos personales que no se registran ni se muestran.'
  title: Réplica del backend de Tabbie
  version: 1.0.0
openapi: 3.0.0
paths:
  /auth/login:
    post:
      description: Público. Con USE_FIREBASE desactivada responde 503 y no emite ningún JWT. Un body sin firebaseIdToken, un token inválido o vencido, o un token sin email responden 401.
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDeLogin'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: ID token ausente, inválido, vencido o sin email.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Firebase desactivado (USE_FIREBASE).
      summary: Canjea un ID token de Firebase por un JWT propio (T01)
      tags:
        - auth
  /restaurants/{id}/tables/active:
    get:
      description: 'Mesas con isBusy y una sesión activa (closedAt nulo), por number ascendente. Cada sesión trae sus usuarios y sus pedidos (sin los pending, con los canceled, por createdAt ascendente). Reproduce O4 a propósito (DP-50): no excluye campos, así que llegan mercadoPagoToken, mercadoPagoRefreshToken y los email. El JWT va en Authorization: Bearer o en ?token=.'
      operationId: RestaurantsController_mesasActivas
      parameters:
        - description: Uuid del restaurante.
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Table'
                type: array
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT, vencido, con otra firma o con un userId inexistente.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Rol fuera de @Roles o restaurante distinto del del usuario.
      security:
        - bearer: []
      summary: Mesas ocupadas del restaurante con sus pedidos (T05)
      tags:
        - restaurants
  /sse/waiters:
    get:
      description: 'Server-Sent Events del restaurante del usuario. El JWT va en Authorization: Bearer o en ?token=; con un JWT vencido responde 401 antes de abrir el stream. Sin heartbeat ni replay. Eventos: `order-confirmed-notification` (data: {"body": "<JSON en string>"} con orderId, tableNumber, tableSessionId, restaurantId y confirmedAt; lo emite PUT /orders/:id/confirm, TK-03), `in-person-payment-request` (data: la solicitud de cobro; lo emite POST /payments/in-person-request, TK-03) e `in-person-payment-request-deleted` (data: {requestId, restaurantId}; lo emite DELETE /payments/in-person-requests/:requestId, TK-13). Este ticket no emite ninguno.'
      operationId: SseController_mozos
      parameters: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: Stream abierto.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: Sin JWT, vencido, con otra firma o con un userId inexistente.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorHttp'
          description: El usuario no tiene restaurante (DP-64).
      security:
        - bearer: []
      summary: Stream de eventos para los mozos del restaurante (T16, T17)
      tags:
        - sse
servers: []
tags: []
